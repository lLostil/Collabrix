[project]
name = "collabrix"
version = "0.1.0"
description = "Collaborative knowledge platform API"
authors = [{name = "Collabrix", email = "dev@collabrix.local"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "SQLAlchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.2", "httpx>=0.27.0", "ruff>=0.4.8"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"